no cinema", "items": [{"k": "p", "s": [{"t": "Nada melhor que a tela do cinema para contar os 20 anos do Lollapalooza, seu conceito e sua chegada ao Brasil. Uma parceria com o Cinemark levou um mini-doc às sessões das salas digitais.", "st": ""}]}, {"k": "vids", "l": [{"y": "8zZbTQC1YzM", "th": "f6f544229e4dfea0cf91e98ac2583929"}]}]}, {"t": "2012 — Interativo como um aplicativo", "items": [{"k": "p", "s": [{"t": "Para divulgar o festival e o aplicativo oficial, um anúncio interativo na Rolling Stone, com mais de 50 mil interações. E, na linha amarela do metrô, a 600 metros do Jockey Club, um QR code para montar e compartilhar o line-up.", "st": ""}]}, {"k": "imgs", "l": [{"id": "85afdda6a1bdde15e7770ce5b38c9646", "w": 1000, "h": 707}, {"id": "6e4ccc643351729c68227058bafec59d", "w": 670, "h": 503}, {"id": "b1ae502249d9855f2526bf056c50974e", "w": 1000, "h": 664}]}, {"k": "imgs", "l": [{"id": "86b607021271c7f305d569c3b83f20de", "w": 670, "h": 505}, {"id": "a60f3aa4736d0a3cffd50f5e66765f52", "w": 546, "h": 662}]}]}, {"t": "2012 — Social media e digital", "items": [{"k": "p", "s": [{"t": "O grande foco da campanha foram as redes sociais: de 0 a 600 mil seguidores em dois anos, mais de 80 mil cadastrados e um público que não só consome o conteúdo, mas gera o seu próprio. 150 mil likes no Facebook no primeiro mês, 1 milhão de visitas ao site, 3 mil downloads do aplicativo e 12 vezes nos trending topics.", "st": ""}]}, {"k": "vids", "l": [{"y": "6eoTXGcXBv4", "th": "ce06888dd47a5d8aa79e425b4fa47c67"}]}]}, {"t": "2012 — Ao vivo, onde você estiver", "items": [{"k": "p", "s": [{"t": "O Multishow transmitiu ao vivo os palcos principais, e os palcos Perry e Alternativo foram transmitidos pela internet. Mais de 43 milhões de pessoas passaram pelo Multishow nas 20 horas de transmissão, com 1,2 milhão de pageviews no site do canal e quase 260 mil views ao vivo.", "st": ""}]}]}, {"t": "2013 — Desafio", "items": [{"k": "p", "s": [{"t": "Uma pesquisa com a Limo Inc no Lolla 2012 mostr <label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">E-mail</span><input id="kco-f-email" class="kco-in" type="email" autocomplete="email"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Empresa / agência</span><input id="kco-f-empresa" class="kco-in" type="text" autocomplete="organization"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Tipo de projeto</span><select id="kco-f-tipo" class="kco-in"><option>Campanha / key visual</option><option>Branding e identidade</option><option>Apresentação / pitch</option><option>Evento / experiência</option><option>Digital / redes sociais</option><option>Outro</option></select></label>
<label style="display: block; grid-column: 1 / -1"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Sobre o projeto</span><textarea id="kco-f-msg" class="kco-in" rows="4"></textarea></label>
</div>
<p role="alert" aria-live="assertive" style="margin: 16px 0 0; min-height: 24px; font-size: 14px; color: {{accent}}">{{contactError}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px">
<button type="button" class="kco-btn" onClick="{{sendContact}}" style="min-height: 48px; padding: 0 22px; background: #111111; color: #FAFAFA; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Enviar por e-mail →</button>
<button type="button" class="kco-btn" onClick="{{sendWhats}}" style="min-height: 48px; padding: 0 22px; background: transparent; color: #111111; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Enviar pelo WhatsApp</button>
</div>
</sc-if>
</div>
</sc-if>
</template>
<div id="app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Ative o JavaScript para ver o portfólio de Kco Oyakawa.</p></noscript>
</body>
</html>
