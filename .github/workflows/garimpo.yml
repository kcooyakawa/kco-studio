name: Garimpo W3W Select
on:
  schedule:
    - cron: "17 0 * * *"   # 21h17 em São Paulo
  workflow_dispatch:
  push:
    branches: [garimpo-robo]
    paths: ["garimpo/**", ".github/workflows/garimpo.yml"]
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r garimpo/requirements.txt
      - run: python garimpo/diag.py
        if: github.event_name == 'push'
      - run: python garimpo/garimpo.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
