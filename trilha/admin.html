<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex">
<title>Admin · Curso Tráfego Imóveis by W3W</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--s1:#121215;--s2:#18181c;--s3:#222228;--hair:rgba(255,255,255,.07);--hair2:rgba(255,255,255,.12);--t1:#f4f4f6;--t2:#9b9ba6;--t3:#62626c;--a1:#7c5cff;--a2:#e85d9c;--a3:#ff9a62;--g:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));--ok:#3ddc97;--warn:#ffb35c;--bad:#ff7a7a;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
::selection{background:var(--a1);color:#fff}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px;border-radius:10px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top);background:rgba(10,10,12,.8);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid var(--hair)}
header .wrap{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-size:13px;font-weight:600;color:var(--t2)}.mark b{color:var(--t1)}
.hbtn{font-size:13px;font-weight:600;color:var(--t2);padding:8px 12px;border-radius:99px;transition:.2s}.hbtn:hover{background:var(--s2);color:var(--t1)}
h1{font-size:clamp(30px,5vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:40px 0 6px}
.sub{color:var(--t2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border:1px solid var(--hair);border-radius:22px;overflow:hidden}
.kpis>div{padding:18px 20px}.kpis>div+div{border-left:1px solid var(--hair)}
.kpis .k{font-size:12.5px;color:var(--t3);font-weight:500}
.kpis .v{font-size:28px;font-weight:700;letter-spacing:-.035em;margin-top:2px}
.kpis .v small{font-size:14px;color:var(--t3);font-weight:500;letter-spacing:0}
.tools{display:flex;gap:10px;margin:32px 0 14px;flex-wrap:wrap;align-items:center}
.tools h2{font-size:22px;font-weight:700;letter-spacing:-.025em;margin-right:auto}
.search{height:40px;border-radius:99px;background:var(--s1);border:1px solid var(--hair2);padding:0 16px;width:220px;outline:none}
.search:focus{border-color:var(--a1)}
.seg{display:flex;background:var(--s1);border:1px solid var(--hair);border-radius:99px;padding:3px}
.seg button{font-size:13px;font-weight:600;color:var(--t2);padding:6px 12px;border-radius:99px;transition:.2s}
.seg button.on{background:var(--s3);color:var(--t1)}
.list{display:grid;gap:8px}
.st{background:var(--s1);border:1px solid var(--hair);border-radius:20px;overflow:hidden;transition:border-color .3s}
.st.open{border-color:var(--hair2)}
.row{width:100%;display:grid;grid-template-columns:40px 1.6fr 1fr 1.3fr .9fr 18px;gap:16px;align-items:center;padding:14px 18px}
.av{width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--t2)}
.st.top .av{background:var(--g);color:#fff}
.nm b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.nm span{font-size:12.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.md{font-size:13px;color:var(--t2)}.md b{display:block;color:var(--t1);font-weight:500;font-size:14px}
.pg{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:4px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.pg b{font-size:14px;font-weight:600;min-width:38px;text-align:right}
.chip{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--t2);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(61,220,151,.1)}
.chip.warn{color:var(--warn);background:rgba(255,179,92,.1)}
.chip.bad{color:var(--bad);background:rgba(255,122,122,.1)}
.chip.done{color:#fff;background:var(--g)}
.chev{width:18px;height:18px;color:var(--t3);transition:transform .35s var(--ease)}
.st.open .chev{transform:rotate(90deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.st.open .det{grid-template-rows:1fr}.det>div{overflow:hidden}
.di{padding:4px 18px 20px 74px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.dm .k{font-size:11.5px;color:var(--t3);font-weight:600}
.dm .t{font-size:12.5px;color:var(--t2);margin:2px 0 8px;line-height:1.3;min-height:33px}
.dm .bar i{background:var(--a1)}
.dm.full .bar i{background:var(--ok)}
.dm .p{font-size:12px;color:var(--t3);margin-top:5px}
.dx{grid-column:1/-1;display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--t3);border-top:1px solid var(--hair);padding-top:14px;margin-top:4px}
.dx b{color:var(--t1);font-weight:600}
.empty{border:1px dashed var(--hair2);border-radius:22px;padding:44px 24px;text-align:center;color:var(--t2)}
.empty b{display:block;color:var(--t1);font-size:17px;margin-bottom:6px}
.invite{margin-top:28px;border:1px solid var(--hair);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center}
.invite b{font-size:16px;font-weight:600}.invite p{font-size:13.5px;color:var(--t2);margin-top:2px}
.invite code{grid-column:1/-1;font-size:13px;background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;color:var(--t2);overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{height:42px;padding:0 18px;border-radius:99px;background:var(--t1);color:#0a0a0c;font-weight:600;font-size:14px;text-align:center;white-space:nowrap}
footer{padding:36px 0 48px;font-size:12.5px;color:var(--t3)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate form{width:min(380px,100%)}
.gate .logo{width:52px;height:52px;border-radius:16px;background:var(--g);margin-bottom:24px}
.gate h2{font-size:28px;font-weight:700;letter-spacing:-.03em}
.gate p{color:var(--t2);margin:8px 0 24px}
.gate input{width:100%;height:50px;border-radius:14px;background:var(--s1);border:1px solid var(--hair2);font-size:16px;padding:0 16px;margin-bottom:12px;outline:none}
.gate input:focus{border-color:var(--a1)}
.gate .btn{width:100%;height:52px;font-size:15.5px}
.gate .msg{font-size:13.5px;color:var(--t2);margin-top:16px;text-align:center;min-height:20px}
.gate .msg.err{color:var(--bad)}
.skel{height:68px;border-radius:20px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}.kpis>div:nth-child(3){border-left:0}.kpis>div:nth-child(-n+2){border-bottom:1px solid var(--hair)}
  .row{grid-template-columns:40px 1fr auto;gap:12px;padding:14px}
  .row .md{display:none}.row .pg{grid-column:2/4;grid-row:2}.row .chev{display:none}
  .di{grid-template-columns:repeat(2,1fr);padding:4px 14px 18px}
  .search{width:100%}.tools h2{width:100%}
  .invite{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script>
const MODS=[['Mercado imobiliário',[0,1,3,4]],['Estratégia de aquisição',[0,1,3,4]],['Tráfego pago',[0,1,2,5,6]],['Criativos e conversão',[0,1,2,5,6]],['CRM e qualificação',[0,1,4,5]],['Performance',[0,1,2,4,5]]];
const TOTAL=[5,5,7,7,6,6];
const $=s=>document.getElementById(s),app=$('app'),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.HERP_CONFIG||{};
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const head=(right='')=>`<header><div class="wrap"><div class="mark"><b>Curso Tráfego Imóveis</b> · Painel de alunos</div>${right}</div></header>`;

if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){
  app.innerHTML=head()+`<main class="wrap"><h1>Falta conectar o banco</h1><p class="sub">Preencha o arquivo <b>config.js</b> com a URL e a chave do Supabase para o painel funcionar.</p></main>`;
}else{
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let rows=[],filter='all',qry='',openId=null;

function ago(d){const m=(Date.now()-new Date(d))/6e4;if(m<60)return 'agora há pouco';const h=m/60;if(h<24)return 'há '+Math.floor(h)+'h';const dd=Math.floor(h/24);return dd===1?'ontem':'há '+dd+' dias'}
const days=d=>(Date.now()-new Date(d))/864e5;
function status(r){if(r.modulo>6)return['done','Formada'];const d=days(r.updated_at);if(d<=3)return['ok','Ativa'];if(d<=7)return['warn','Esfriando'];return['bad','Parada']}
function modStats(r){const done=(r.state&&r.state.done)||{};return TOTAL.map((n,i)=>{let c=0;for(let j=0;j<n;j++)if(done[i+'-'+j])c++;return c/n})}

async function gate(){
  app.innerHTML=`<div class="gate"><form id="f"><div class="logo"></div><h2>Painel de admin</h2><p>Entre com o e-mail de administrador. Enviamos um link de acesso.</p>
  <input id="e" type="email" required autocomplete="email" placeholder="seu@email.com"><button class="btn" id="b">Receber link</button><div class="msg" id="m"></div></form></div>`;
  $('f').onsubmit=async e=>{e.preventDefault();$('b').disabled=true;$('m').className='msg';$('m').textContent='Enviando…';
    const {error}=await sb.auth.signInWithOtp({email:$('e').value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});
    $('b').disabled=false;if(error){$('m').className='msg err';$('m').textContent='Não foi possível enviar. Tente de novo.'}else $('m').textContent='Abra o link que enviamos para o seu e-mail.'};
}
function shell(){
  app.innerHTML=head('<button class="hbtn" id="out">Sair</button>')+`<main class="wrap">
  <h1>Seus alunos</h1><p class="sub" id="upd">Carregando…</p>
  <div class="kpis"><div><div class="k">Alunos</div><div class="v num" id="k1">–</div></div><div><div class="k">Progresso médio</div><div class="v num" id="k2">–</div></div><div><div class="k">Ativos (7 dias)</div><div class="v num" id="k3">–</div></div><div><div class="k">Precisam de atenção</div><div class="v num" id="k4">–</div></div></div>
  <div class="tools"><h2>Turma</h2><input class="search" id="q" placeholder="Buscar nome ou e-mail" type="search">
  <div class="seg" id="seg"><button data-f="all" class="on">Todos</button><button data-f="ok">Ativos</button><button data-f="att">Atenção</button><button data-f="done">Formados</button></div></div>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="invite"><div><b>Convidar novo aluno</b><p>Envie este link. A pessoa entra com o próprio e-mail e aparece aqui automaticamente.</p></div><button class="btn" id="cp">Copiar link</button><code id="lk"></code></div>
  <footer>Atualiza sozinho a cada minuto.</footer></main>`;
  const link=location.origin+location.pathname.replace(/admin\.html$/,'');$('lk').textContent=link;
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('cp').textContent='Copiado'}catch(e){$('cp').textContent='Copie abaixo'}setTimeout(()=>$('cp').textContent='Copiar link',2000)};
  $('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
  $('q').oninput=e=>{qry=e.target.value.toLowerCase();render()};
  $('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));render()};
  $('list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id;openId=openId===id?null:id;document.querySelectorAll('.st').forEach(s=>{const o=s.dataset.id===openId;s.classList.toggle('open',o);s.querySelector('.row').setAttribute('aria-expanded',o)})};
}
function render(){
  const n=rows.length,avg=n?Math.round(rows.reduce((a,r)=>a+r.pct,0)/n):0,act=rows.filter(r=>days(r.updated_at)<=7).length,att=rows.filter(r=>r.modulo<=6&&days(r.updated_at)>3).length;
  $('k1').textContent=n;$('k2').innerHTML=avg+'<small>%</small>';$('k3').textContent=act;$('k4').textContent=att;
  $('upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  let L=rows.filter(r=>{const s=status(r)[0];if(filter==='ok'&&s!=='ok')return false;if(filter==='att'&&!(s==='warn'||s==='bad'))return false;if(filter==='done'&&s!=='done')return false;
    return !qry||(r.nome||'').toLowerCase().includes(qry)||(r.email||'').toLowerCase().includes(qry)});
  if(!n){$('list').innerHTML='<div class="empty"><b>Nenhum aluno ainda</b>Copie o link abaixo e envie para a primeira pessoa.</div>';return}
  if(!L.length){$('list').innerHTML='<div class="empty"><b>Nada por aqui</b>Nenhum aluno neste filtro.</div>';return}
  const best=Math.max(...rows.map(r=>r.pct));
  $('list').innerHTML=L.map(r=>{const [sc,sl]=status(r),ms=modStats(r),m=Math.min(r.modulo,6);
    return `<div class="st${openId===r.user_id?' open':''}${r.pct===best&&best>0?' top':''}" data-id="${r.user_id}">
    <button class="row" data-id="${r.user_id}" aria-expanded="${openId===r.user_id}">
      <div class="av">${esc((r.nome||r.email||'?')[0].toUpperCase())}</div>
      <div class="nm"><b>${esc(r.nome||'Sem nome')}</b><span>${esc(r.email)}</span></div>
      <div class="md">${r.modulo>6?'<b>Laboratório</b>Todos concluídos':`<b>Módulo ${pad(m)}</b>${MODS[m-1][0]}`}</div>
      <div class="pg"><div class="bar"><i style="width:${r.pct}%"></i></div><b class="num">${r.pct}%</b></div>
      <span class="chip ${sc}"><i></i>${sl}</span>${chev}
    </button>
    <div class="det"><div><div class="di">${ms.map((p,i)=>`<div class="dm${p>=1?' full':''}"><div class="k">Módulo ${pad(i+1)}</div><div class="t">${MODS[i][0]}</div><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><div class="p num">${Math.round(p*100)}%</div></div>`).join('')}
      <div class="dx"><span>Último acesso <b>${ago(r.updated_at)}</b></span><span>XP <b class="num">${r.xp}</b></span><span>Tarefas <b class="num">${r.tarefas} de 36</b></span><span>Começou em <b>${new Date(r.created_at).toLocaleDateString('pt-BR')}</b></span></div>
    </div></div></div></div>`}).join('');
}
async function load(){const {data,error}=await sb.from('progress').select('*').order('updated_at',{ascending:false});if(error){$('upd').textContent='Não foi possível carregar. Tentando de novo…';return}rows=data||[];render()}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return gate();
  const {data:isAdm}=await sb.rpc('is_admin');
  if(!isAdm){app.innerHTML=head()+`<main class="wrap"><h1>Acesso restrito</h1><p class="sub">${esc(session.user.email)} não está na lista de administradores.</p><p style="margin-top:20px"><button class="btn" id="o">Sair</button></p></main>`;$('o').onclick=async()=>{await sb.auth.signOut();location.reload()};return}
  shell();load();setInterval(load,60000);
})();
}
</script>
</body>
</html>
