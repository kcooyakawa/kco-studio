<style>
:root{--bg:#F5F3EE;--ink:#14213D;--mut:#6B7385;--line:#DEDAD0;--card:#fff;--acc:#14213D}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

.meta{flex:1;min-width:200px}.meta b{display:block;font-weight:600;font-size:16px;word-break:break-word}.meta span{color:var(--mut);font-size:14px}

a.btn:hover{opacity:.9}a.btn:active{transform:scale(.97)}
footer{padding:24px clamp(16px,5vw,64px);color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
