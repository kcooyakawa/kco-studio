": 934}, {"id": "0157bd38430fa03a65080f2cc18e50eb", "w": 1400, "h": 934}, {"id": "7082992d3e2ad017f141e3275145d5e4", "w": 1400, "h": 934}]}]}]}, {"id": "stap-gafff", "title": "Corteva — GAFFFF 2025", "cat": "Booths", "client": "Stap Feelings · Art direction", "year": "2025", "desc": "Corteva’s space at the Global Agribusiness Festival (GAFFFF).", "thumb": "92191985cdaa37623bb9252f6714d8a9", "banner": "92191985cdaa37623bb9252f6714d8a9", "secs": [{"t": "Gallery", "items": [{"k": "imgs", "l": [{"id": "92191985cdaa37623bb9252f6714d8a9", "w": 787, "h": 1400}, {"id": "a4b2f8a1dda7a008f3be5c35b636899a", "w": 783, "h": 1400}, {"id": "c77a0d0708a569a0786b42d1b98480c9", "w": 1400, "h": 1050}, {"id": "0cf3af7181eada1149b87cfaf20c7c00", "w": 1385, "h": 1400}, {"id": "5a56e76e7fa816019ea854ca3a0791da", "w": 1050, "h": 1400}]}]}]}, {"id": "stap-lorenzetti", "title": "Lorenzetti — Revestir", "cat": "Booths", "client": "Stap Feelings · Art direction", "year": "", "desc": "Lorenzetti booth at Revestir, one of the largest construction, architecture and interior design shows.", "thumb": "68da8771e779e2b8d47f6dc09f76162c", "banner": "68da8771e779e2b8d47f6dc09f76162c", "secs": [{"t": "Gallery", "items": [{"k": "imgs", "l": [{"id": "68da8771e779e2b8d47f6dc09f76162c", "w": 1400, "h": 934}, {"id": "2bc12a2bb6ff5bc4c0a4909dbb817846", "w": 810, "h": 533}, {"id": "d973ab03da3726e62b61801fbf3ce277", "w": 1400, "h": 788}, {"id": "980c9d38f5911437ee91d3a29908bfc5", "w": 1400, "h": 788}]}]}]}, {"id": "stap-japao", "title": "Toyota — Japan Festival", "cat": "Booths", "client": "Stap Feelings · Art direction", "year": "", "desc": "Toyota booth at the Japan Festival, reinforcing the brand’s ties to Japanese culture.", "thumb": "d28b24a1b711d086de109f8fd7c70d4c", "banner": "d28b24a1b711d086de109f8fd7c70d4c", "secs": [{"t": "Gallery", "items": [{"k": "imgs", "l": [{"id": "d28b24a1b711d086de109f8fd7c70d4c", "w": 715, "h": 487}, {"id": "64cd2edb4f1a13eb0a111551a37de01d", "w": 1400, "h": 934}, {"id": "13 const caseStory = {"nba-deck": {"st": "A deck to sell the NBA in Brazil: data, fans and properties told like a big game.", "rows": [{"k": "The project", "v": "NBA Brasil needed a sales presentation for the 2021/22 season, the league's 75th, showing brands and sponsors the size of its fan base in Brazil and everything the league offers here."}, {"k": "What I did", "v": "Art direction for the whole deck: visual narrative, layout of audience data and a distinct language for each platform — Events, NBA House, Jr. NBA, Her Time to Play, NBA Basketball School and Media."}, {"k": "Deliverables", "v": "Sales deck · Infographics · Chapter openers · Image treatment"}]}, "stap-syngenta": {"st": "Syngenta held its 2025 Technical Councils Meeting, bringing together the partners of its three councils — Consherb, Consent and Consfit — at the Royal Palm Plaza in Campinas.", "rows": [{"k": "The challenge", "v": "The meeting also celebrated the councils' 25th anniversary, bringing them together in a single event for the first time. For Stap Feelings, Syngenta's live marketing partner, it was a chance to show our work, from design and creation to operation, built day by day, minute by minute, making every step an important part of an incomparable event."}, {"k": "The solution", "v": "Seizing a unique opportunity to bring the councils together, we created an event focused on relationships and on sharing knowledge and results. The highlight, at the opening plenary, was the connection of the three councils in an innovative representation that brought concept and design together. In a show of technique and visual and sound effects, three giant LED panels — one per council — joined to form a single one, expressing a shared vision aligned with the future of agribusiness."}, {"k": "Experiences", "v": "The experiential mood, present from the opening, continued with several activations and surprises throughout the event. Notably, participants received an integration passport encouraging interaction and exchange between the councils. A special experience was saved for the last day: a visit to the Innvernia winery in Espírito Santo do Pinhal, with a wine tasting, a paired lunch with live music and a visit to the vineyard, where participants learned about its vine adoption program."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-vwfest": {"st": "The event had to be a moment of pure connection.", "rows": [{"k": "The challenge", "v": "Held at the Lar Center complex in São Paulo on June 28 and 29, it set out to promote Brazil's biggest sales festival while offering a family day full of unforgettable experiences and relationships. The São Paulo Volks Festival set the standard for the 2025 season. From August to December, the event toured 5 more state capitals: Salvador, Brasília, Goiânia, Porto Alegre and Curitiba."}, {"k": "The solution", "v": "Stap led creation and production, delivering a modern, functional design with creative, high-impact communication. The event included the Best Drive activation, Volkswagen's flagship test drive. The full operation, also run by Stap, covered logistics, build, supplier and partner management, reception and registration, experiences and support for participating dealers."}, {"k": "Curitiba — closing in style", "v": "The Volks Festival closed the 2025 season in Curitiba, at the Pedreira Paulo Leminski, a traditional venue for major events in the city. The original design was adapted to make use of the local structure, proving its modularity and adaptability without losing functionality or visual identity."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-seara-diac": {"st": "Seara brought together supermarket chain owners at Espaço L’Atelier, São Paulo, in July 2025.", "rows": [{"k": "The challenge", "v": "The focus was to present a new company strategy to revolutionize the point of sale, by understanding shopper behavior and new opportunities to grow the business. Starting a new live marketing partnership, Stap delivered excellence in creation, design, production and event management, creating the right environments for each moment and connecting relationships, information, innovation and experiences."}, {"k": "The solution", "v": "A content-rich plenary brought guests together in a comfortable, welcoming auditorium. A giant LED screen supported speakers from Seara's marketing and sales teams, presenting market figures, changes in consumer behavior, openings for innovation and the opportunities of growing demand. To round it off, a panel of experts debated the point of sale, building a relevant picture for the audience and the goals of the meeting."}, {"k": "Experiences", "v": "Participants enjoyed true taste experiences with a big tasting that proved the quality of Seara products in practice. There were two moments: the first on arrival, with a welcome coffee in a point-of-sale setting designed by the agency; the second at the end, with a pleasant happy hour to the great jazz of Amber Banda. In every detail, an unforgettable event with the Stap signature, connecting brand, market and retail channels, with a lasting impression for Seara and its guests."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-loyant": {"st": "Launching a herbicide the way you launch a brand.", "rows": [{"k": "The challenge", "v": "For Corteva, launching a new herbicide for rice crops called for more than an event: it had to highlight the company's commitment to innovation and surprise a technical audience with a memorable experience."}, {"k": "The solution", "v": "At Casa NTX in Porto Alegre, we built a stage with an immersive screen that drew the audience into the content, connecting innovation and technology. The space was planned to be comfortable and integrated. To ensure quality and flow, the build was closely followed at every stage."}, {"k": "Experiences", "v": "From the pre-event, with strategic digital communication, to the closing show by Fernando & Sorocaba, everything was designed to make an impact and reinforce the brand's positioning. The set design, content and innovative audience layout reinforced the sense of modernity and innovation."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-prospera": {"st": "A set that gives agribusiness content the look of a real show.", "rows": [{"k": "The challenge", "v": "Focused on Corteva's Prospera program, a special TV production set out to record results in rural communities in the state of Pernambuco."}, {"k": "The solution", "v": "Stap was responsible for producing the TV special, including field shoots and interviews with beneficiaries and leaders, as well as the script, direction, logistics and the project's visual identity."}, {"k": "Experiences", "v": "With appearances by the Minister of Agriculture, the Secretary of Family Farming and executives from Corteva, Yara and AGCO, the content reinforced the program's impact and Corteva's position as a partner in rural development."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-petronas": {"st": "During the F1 Grand Prix in São Paulo, Petronas needed to highlight three key moments: a sales convention, a press conference and a stakeholder dinner.", "rows": [{"k": "The challenge", "v": "We met the challenge by creating experiences with innovation, belonging and visibility worthy of the brand."}, {"k": "Experiences", "v": "In every detail, the agency's work was designed for impact and flow: a convention with set design center stage, a press conference with precise logistics and a dinner with a warm atmosphere."}, {"k": "Experiences", "v": "The press conference brought together Petronas team drivers Lewis Hamilton and George Russell and generated major press exposure. The dinner focused on relationships, comfort and excellent service. Team building, gifts and attendance at practice and the GP marked the convention. At the press conference and dinner, interaction with personalities and one-to-one actions strengthened the bond with the brand."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-gazoo": {"st": "Gazoo Racing Day is Toyota's main global platform for connecting motorsport, innovation and people development.", "rows": [{"k": "The challenge", "v": "The challenge was to turn that idea into a brand experience that generated relationships, visibility and relevant content."}, {"k": "The solution", "v": "Stap planned and produced the entire event structure at the racetracks, handling vehicle logistics, space builds, flow planning, supplier management and technical operation, ensuring comfort, safety and alignment with the brand's goals."}, {"k": "Experiences", "v": "The event featured test drives, technical demonstrations, interaction with drivers and exclusive activations for different audiences. Over two days it welcomed specialist press, customers, partners and guests, including the GR Day Woman edition, dedicated to driving experiences centered on women."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-hilux": {"st": "Toughness isn't explained. It's lived.", "rows": [{"k": "The challenge", "v": "Toyota wanted to reinforce the Hilux's position as a rugged, reliable vehicle by creating Hilux Expedition, a regularity rally that became an engaging experience with strong brand presence in key markets."}, {"k": "The solution", "v": "The agency managed the entire Hilux Expedition operation, including calendars, routes, regulations, registrations, permits, dealer participation, full logistics and supplier hiring, always aligned with the client's goals and focused on safety and efficiency."}, {"k": "Experiences", "v": "Participating owners tested their vehicles on different terrains, with technical support and activations highlighting the Hilux's strengths. The action drove engagement, environmental responsibility — tree planting — and brand reinforcement along the route."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-ox": {"st": "The OX Cosméticos booth was one of the highlights of Beauty Fair 2025.", "rows": [{"k": "The challenge", "v": "The strategy was to reinforce the partnership with the Mari Maria brand and highlight the launches co-created with OX: the OX Science line, the cocoa-based Wonka line and OX's innovative actives. With so many stars on stage, live marketing became even more important. With our expertise, we delivered the best in design, creation, production and operation."}, {"k": "The solution", "v": "Starting with the booth, we created a design as innovative and bold as the OX brand, with attractive, elegant lines in harmony with the featured launches. The project included high-impact visual communication featuring the entire OX Haircare portfolio and a structure for relationships and business. To finish, an exquisite, safe build of impeccable quality. In operation, we were present in every space and moment, ensuring flow, hospitality and visitor and guest retention."}, {"k": "Experiences", "v": "Visitors to Beauty Fair enjoyed fully connected experiences. In the OX Science area, scanner technology read and diagnosed hair treatment needs, delivered to each participant via QR code. In the Wonka area, the experiences focused on the launches. For Stap Feelings, the event was a chance to show our work in every space and moment, optimizing results and strengthening the partnership with the client."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-seara-bahia": {"st": "With a standout presence at SuperBahia 2025, Seara completed an important step in its strategy of brand building and market expansion, this time focused on supermarket entrepreneurs in Brazil's Northeast.", "rows": [{"k": "The challenge", "v": "As its new live marketing partner, Stap also landed in Salvador committed to another quality delivery, handling design, production and operation."}, {"k": "The solution", "v": "The agency created a modern, open and inviting booth with a strong style and personality and integrated solutions for relationships and business, connecting functionality — a welcoming lounge and several meeting rooms for simultaneous meetings —, brand exposure and high-impact visual communication with plenty of content covering Seara's product lines and many launches."}, {"k": "Experiences", "v": "With its integrated management expertise, the agency took on reception and hospitality to make every visit a rewarding, enriching experience. In a journey of sensations, the connection with the products, sparked by eye-catching visual communication, was completed by a high-end tasting of Seara's product lines."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-grunner": {"st": "For Grunner, visitors to its Agrishow booth had to feel at home.", "rows": [{"k": "The challenge", "v": "The booth also had to reflect pioneering quality and technology which, along with ruggedness and durability, set its products for the field apart."}, {"k": "The solution", "v": "The booth — modern and bold, like the brand — came from a design tailored to Grunner: accessible and functional for relationships and business. High-impact visual communication and the Grunner boutique were key to reinforcing brand presence and experience."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-fmc": {"st": "A partnership that keeps on rolling across the Circuito Agro.", "rows": [{"k": "The challenge", "v": "Stap continues as FMC's partner on the 2026 Circuito Agro, bringing its expertise in design, build and operation to optimize the company's presence, reinforce its position as a benchmark in agricultural technology and strengthen its partnership with growers."}, {"k": "The solution", "v": "Since 2025 the agency has delivered a new modular booth with a strong personality. It combines a down-to-earth style with strong brand presence and details that connect design, materials and finishes. High-exposure visual communication and content, accessibility and transparency create an inviting space where visitors find welcoming, comfortable areas and themed settings with references to the countryside."}, {"k": "Operation", "v": "Stap manages the operation end to end, supporting relationship and business activities that include specialized service, talks and visits to the applied-technology plots, with all the safety and comfort of a functional structure."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-vwagro": {"st": "To strengthen the brand's presence in agribusiness, Volkswagen needed a booth that mirrored its identity and created a direct connection with the public.", "rows": [{"k": "The challenge", "v": "The challenge was to translate the brand's attributes into an experience that brought together form, function and relationships."}, {"k": "The solution", "v": "Stap developed a modular structure adaptable to the different formats of the Circuito Agro, with timber set design, landscaping and exhibition areas that showcased the vehicles. The operation was designed for efficiency, accessibility and seamless flow between spaces."}, {"k": "Experiences", "v": "The relaxed, upbeat atmosphere — with Volkswagen-standard hospitality — won visitors over, creating a strong connection with the brand and its products."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-ford": {"st": "In the 2026 season, Ford keeps its focus on the agribusiness circuit events, which deliver the company's best ROI.", "rows": [{"k": "The challenge", "v": "Stap continues as its live marketing partner, standing alongside Ford to optimize a winning project inspired by the Built Ford Tough concept, which adds quality, durability and strength to the brand's image in Brazilian agribusiness."}, {"k": "The solution", "v": "Continuing the strategy of building the brand image through a rugged, high-quality, safe booth, the agency reinterpreted the 2025 design, keeping the corten steel façade, whose modern-rustic look is fully integrated with the Raça Forte line-up key visual. The work included layout and functionality improvements, stronger brand presence and high-exposure visual communication aligned with the Ready Set Ford campaign."}, {"k": "Operation", "v": "Through integrated management, the agency handles suppliers and partners, runs the operation and supports the Test Drive build and operation. To stay consistent with previous seasons, qualify as many customers as possible and increase retention, KPIs such as sales, ROI, test drives, attendance and relationship and business meetings are tracked. A 12-event season includes 4 regional events, with a pocket version of the project and strong participation from local dealers."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-gafff": {"st": "GAFFFF – Global Agribusiness Festival brings together the world's largest agribusiness forum, an agricultural fair and an entertainment and food event.", "rows": [{"k": "The challenge", "v": "Corteva was the lead sponsor of the 2025 edition at Allianz Parque, São Paulo. Stap, its live marketing partner, was tasked with turning Corteva's presence into a unique experience, connecting design, production and operation into a complete solution for the client."}, {"k": "The solution", "v": "With a design built for the arena setting and the scale of GAFFFF, Stap delivered a themed booth matched to the event and its audience, prioritizing spaces for relationships and business, and visual communication highlighting the brand and Corteva's solutions for growers."}, {"k": "Experiences", "v": "Visitors found a booth with a relaxed, friends-get-together feel, set against the buzz and attractions of the event. On the mezzanine, Corteva hosted guests to enjoy every moment of GAFFFF 2025 exclusively — a privileged spot with security, comfort and VIP service."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-lorenzetti": {"st": "At one of the largest construction, architecture and interior design shows, Lorenzetti wanted more than a booth.", "rows": [{"k": "The challenge", "v": "The challenge was to create a space that embodied the idea of home and connected with the public through real experiences with its products."}, {"k": "The solution", "v": "The agency developed a booth set up as a model home, with generous spaces, designed lighting and displays showing the products in use. The set design used visual elements associated with water, which is central to the Lorenzetti brand."}, {"k": "Experiences", "v": "The tour of the house was designed as a customer journey, combining function and concept. The space included lounge areas with bleachers fitted with tables and power points, which became a meeting point and a highlight of the fair."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-japao": {"st": "Toyota celebrating its roots at the Japan Festival.", "rows": [{"k": "The challenge", "v": "Toyota's goal was to reinforce its ties to Japanese culture, paying tribute to 110 years of Japanese immigration to Brazil, while showcasing its launches at an event able to connect tradition and innovation."}, {"k": "The solution", "v": "The agency created a booth based on early 20th-century Japanese architecture, blending modern and traditional elements. It reinterpreted the floating lanterns of the Obon festival as paper boats carried along an imaginary stream across the booth's ceiling, a nod to the first Japanese immigrants who landed in Santos in 1912."}, {"k": "Experiences", "v": "The booth featured cultural performances, origami workshops and other activations integrated with the Toyota vehicle showroom, engaging t <header style="padding-top: clamp(48px, 7vw, 112px)">
<div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: clamp(16px, 2vw, 28px)">{{cur.catYear}}</div>
<h2 class="kco-case-brand" style="margin: 0; font-family: 'KCO Grotesk', sans-serif; font-weight: 600; font-size: clamp(52px, 9.5vw, 168px); line-height: 0.88; letter-spacing: -0.035em; text-transform: uppercase; overflow-wrap: anywhere">{{cur.brand}}</h2>
<p style="margin: clamp(16px, 2vw, 28px) 0 0; max-width: 40em; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; font-size: clamp(13px, 1.1vw, 16px); line-height: 1.45">{{cur.line}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 32px 24px; margin-top: clamp(40px, 5vw, 80px)">
<p class="kco-case-st" style="flex: 999 1 520px; margin: 0; max-width: 24em; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: clamp(22px, 2.5vw, 40px); line-height: 1.08; letter-spacing: -0.01em; text-transform: uppercase">{{cur.statement}}</p>
<div style="flex: 1 1 280px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-content: start">
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Client / agency</div>{{cur.client}}</div>
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Category</div>{{cur.cat}}</div>
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Year</div>{{cur.year}}</div>
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Content</div>{{cur.mediaLine}}</div>
</div>
</div>
<sc-if value="{{cur.hasStory}}" hint-placeholder-val="{{true}}">
<div class="kco-story" style="margin-top: clamp(48px, 6vw, 96px); border-bottom: 1px solid #111111">
<sc-for list="{{cur.storyRows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; padding: clamp(20px, 2.4vw, 32px) 0; border-top: 1px solid #111111">
<div style="flex: 0 0 calc(25% - 18px); min-width: 200px; display: flex; gap: 16px; align-items: baseline"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">{{r.n}}</span><span style="font-family: 'KCO Grotesk', sans-serif; font-weight: 600; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.1; text-transform: uppercase">{{r.k}}</span></div>
<p style="flex: 999 1 520px; margin: 0; max-width: 40em; font-size: clamp(17px, 1.3vw, 20px); line-height: 1.5">{{r.v}}</p>
</div>
</sc-for>
</div>
</sc-if>
</header>
<sc-if value="{{cur.hasBanner}}" hint-placeholder-val="{{true}}">
<figure style="width: 100vw; margin: clamp(48px, 6vw, 96px) 0 0 calc(50% - 50vw); height: clamp(320px, 62vh, 760px); overflow: hidden; background: #111111"><img src="{{cur.banner}}" alt="{{cur.title}}" style="display: block; width: 100%; height: 100%; object-fit: cover"></figure>
</sc-if>

<sc-for list="{{cur.secs}}" as="sec" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; gap: 16px 24px; margin-top: clamp(56px, 6vw, 88px); padding-top: 14px; border-top: {{sec.rule}}">
<div style="flex: 0 0 calc(25% - 18px); min-width: 200px">
<h3 style="position: sticky; top: 92px; margin: 0; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.5; letter-spacing: 0.06em; text-transform: uppercase">{{sec.t}}</h3>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="2">
<sc-if value="{{it.isP}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; max-width: 38em">{{it.text}}</p>
</sc-if>
<sc-if value="{{it.isCap}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">{{it.text}}</p>
</sc-if>
<sc-if value="{{it.isImgs}}" hint-placeholder-val="{{false}}">
<div style="{{it.gridStyle}}">
<sc-for list="{{it.imgs}}" as="im" hint-placeholder-count="3">
<img src="{{im.src}}" alt="{{im.alt}}" loading="lazy" width="{{im.w}}" height="{{im.h}}" style="{{im.style}}">
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isGal}}" hint-placeholder-val="{{false}}">
<div role="group" aria-roledescription="galeria" aria-label="{{it.galLabel}}" style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{it.next}}" aria-label="Next image" style="display: block; width: 100%; padding: 0; border: 0; background: #E8E5DE; cursor: e-resize; aspect-ratio: {{it.stageRatio}}">
<img src="{{it.curSrc}}" alt="{{it.curAlt}}" style="display: block; width: 100%; height: 100%; object-fit: contain">
</button>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 4px; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span style="display: flex; gap: 20px"><button type="button" class="kco-nav" onClick="{{it.prev}}">← Previous</button><button type="button" class="kco-nav" onClick="{{it.next}}">Next →</button></span>
<span aria-live="polite" style="color: #5C5A55; font-variant-numeric: tabular-nums">{{it.counter}}</span>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px">
<sc-for list="{{it.thumbs}}" as="th" hint-placeholder-count="6">
<button type="button" onClick="{{th.pick}}" aria-label="{{th.label}}" aria-current="{{th.cur}}" style="{{th.style}}"><img src="{{th.src}}" alt="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{it.isVids}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 24px">
<sc-for list="{{it.vids}}" as="v" hint-placeholder-count="1">
<a class="kco-vid" href="{{v.href}}" target="_blank" rel="noopener" aria-label="Watch video on YouTube (opens in a new tab)" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111">
<span style="position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #111111">
<img src="{{v.thumb}}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span class="kco-play" aria-hidden="true" style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; background: #111111; border: 1px solid #F3F1EC; color: #F3F1EC; font-size: 16px; transition: background .2s ease">▶</span>
</span>
<span style="display: flex; justify-content: space-between; gap: 16px; padding-top: 8px; border-top: 1px solid #D3CFC6; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase"><span>Video</span><span style="color: #5C5A55">YouTube ↗</span></span>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isMp4}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 24px; align-items: start">
<sc-for list="{{it.mp4s}}" as="m" hint-placeholder-count="1">
<video src="{{m.src}}" poster="{{m.poster}}" controls playsinline muted loop preload="metadata" aria-label="{{m.label}}" style="display: block; width: 100%; height: auto; max-height: 82vh; background: #111111"></video>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isLinks}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #111111; max-width: 720px">
<sc-for list="{{it.links}}" as="lk" hint-placeholder-count="2">
<a href="{{lk.href}}" target="_blank" rel="noopener" style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #D3CFC6; text-decoration: none"><span>{{lk.label}}</span><span aria-hidden="true">↗</span></a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isCr}}" hint-placeholder-val="{{false}}">
<dl style="margin: 0; border-top: 1px solid #111111; max-width: 720px">
<sc-for list="{{it.cr}}" as="c" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 12px 0; border-bottom: 1px solid #D3CFC6">
<dt style="flex: 0 0 220px; color: #5C5A55">{{c.r}}</dt>
<dd style="flex: 1 1 220px; margin: 0">{{c.n}}</dd>
</div>
</sc-for>
</dl>
</sc-if>
</sc-for>
</div>
</div>
</sc-for>

<div style="display: flex; justify-content: space-between; gap: 24px; margin-top: 96px; border-top: 1px solid #111111; padding-top: 16px">
<button type="button" class="kco-btn" onClick="{{prev}}" style="min-height: 44px; padding: 0; border: 0; background: none; color: #111111; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.015em; text-align: left; cursor: pointer">← {{prevTitle}}</button>
<button type="button" class="kco-btn" onClick="{{next}}" style="min-height: 44px; padding: 0; border: 0; background: none; color: #111111; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.015em; text-align: right; cursor: pointer">{{nextTitle}} →</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== POP-UP: CONTATO / ORÇAMENTO ===== -->
<sc-if value="{{contactOpen}}" hint-placeholder-val="{{false}}">
<div onClick="{{closeContact}}" style="position: fixed; inset: 0; z-index: 80; background: rgba(17,17,17,0.55)"></div>
<div role="dialog" aria-modal="true" aria-label="Talk about a project" style="position: fixed; z-index: 81; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: #F3F1EC; color: #111111; padding: clamp(24px, 4vw, 40px); font-family: 'KCO Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.55">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #111111; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span>Quote — 2026</span>
<button type="button" class="kco-btn" onClick="{{closeContact}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #111111; background: transparent; color: #111111; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer">Close ✕</button>
</div>
<sc-if value="{{contactSent}}" hint-placeholder-val="{{false}}">
<h2 style="margin: 40px 0 16px; font-family: 'KCO Grotesk', sans-serif; font-weight: 300; font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -0.035em">Thank you<span style="color: {{accent}}">.</span></h2>
<p style="margin: 0 0 32px; color: #5C5A55">Your message is ready in your e-mail or WhatsApp — just confirm sending it there. I reply within 1 business day.</p>
<button type="button" class="kco-btn" onClick="{{closeContact}}" style="min-height: 48px; padding: 0 22px; background: #111111; color: #F3F1EC; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Back to the site</button>
</sc-if>
<sc-if value="{{contactForm}}" hint-placeholder-val="{{true}}">
<h2 style="margin: 32px 0 8px; font-family: 'KCO Grotesk', sans-serif; font-weight: 300; font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -0.035em">Let's talk<span style="color: {{accent}}">.</span></h2>
<p style="margin: 0 0 28px; color: #5C5A55">Tell me a bit about the project. You stay exactly where you were on the page.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px 24px">
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Name</span><input id="kco-f-nome" class="kco-in" type="text" autocomplete="name"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">E-mail</span><input id="kco-f-email" class="kco-in" type="email" autocomplete="email"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Company / agency</span><input id="kco-f-empresa" class="kco-in" type="text" autocomplete="organization"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Project type</span><select id="kco-f-tipo" class="kco-in"><option>Campaign / key visual</option><option>Branding and identity</option><option>Presentation / pitch</option><option>Event / experience</option><option>Digital / social media</option><option>Other</option></select></label>
<label style="display: block; grid-column: 1 / -1"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">About the project</span><textarea id="kco-f-msg" class="kco-in" rows="4"></textarea></label>
</div>
<p role="alert" aria-live="assertive" style="margin: 16px 0 0; min-height: 24px; font-size: 14px; color: {{accent}}">{{contactError}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px">
<button type="button" class="kco-btn" onClick="{{sendContact}}" style="min-height: 48px; padding: 0 22px; background: #111111; color: #F3F1EC; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Send by e-mail →</button>
<button type="button" class="kco-btn" onClick="{{sendWhats}}" style="min-height: 48px; padding: 0 22px; background: transparent; color: #111111; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Send via WhatsApp</button>
</div>
</sc-if>
</div>
</sc-if>
</template>
<div id="app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Enable JavaScript to see Kco Oyakawa's portfolio.</p></noscript>
</body>
</html>
