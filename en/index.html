 men's final.", "st": ""}]}, {"k": "vids", "l": [{"y": "ViscVgqLpmc", "th": "65962f3c012503acfc67c76fd4738dc1"}]}]}, {"t": "Platform and communication plan", "items": [{"k": "p", "s": [{"t": "The Rio Pro was planned as a communication and marketing platform: arena visibility, activations and proprietary spaces, media presence and branded content. The integrated plan, valued at R$ 930,000, ran from TV and radio to targeted new-media actions, engaging people before the event even began.", "st": ""}]}, {"k": "imgs", "l": [{"id": "48869fd3fad59b8ef35f89beca7aca92", "w": 1250, "h": 817}, {"id": "84f28106ec566aeb91db29c75d5df2d0", "w": 1250, "h": 818}, {"id": "20eb41d852bbea462fcaadec0c3a36e6", "w": 1250, "h": 818}, {"id": "242b3d9956157caaa7d581a0ae3d97cb", "w": 1250, "h": 819}, {"id": "d3a2d3ce3013b636c2a6e2c05dadccdd", "w": 1250, "h": 817}, {"id": "4e358403359d697807be752e86f7ac00", "w": 1250, "h": 817}]}]}, {"t": "A sustainable event", "items": [{"k": "p", "s": [{"t": "An event that depends on nature couldn't ignore sustainability. An inventory of the event's greenhouse gas emissions became an offset plan, planting native Atlantic Forest seedlings in Rio. Banner vinyl became surfboard bags at NGOs, alongside talks for children, recycling drives and actions in both arenas.", "st": ""}]}]}, {"t": "Rio Pro 2012", "items": [{"k": "vids", "l": [{"y": "QrBRtu_9w6w", "th": "779c391bc5cca9fc8b29c09c32f02472"}]}, {"k": "imgs", "l": [{"id": "bb04abb72e1e3ecda833022cc579bff6", "w": 1600, "h": 1526}, {"id": "378f52fa92204c794070fe7fc67e202e", "w": 1109, "h": 762}, {"id": "6e353dcefe2869864d73de616a1db920", "w": 1068, "h": 1600}, {"id": "daa0b45008755479c9b3eaf19680f396", "w": 1600, "h": 889}, {"id": "45455c2b5c4b8ddb9ff240579c2eb31d", "w": 1600, "h": 797}]}]}]}, {"id": "dblock", "title": "dBlock — Music District", "cat": "Events", "client": "GEO Eventos", "year": "", "desc": "Concept and pitch book for an urban music festival: instead of tents and mud, an entire city block in the heart of São Paulo.", "thumb": "722835a94af933ce89009598c4c2e905", "secs": [{"t": "Music District", "items": [{"k": "p", "s": [{"t": "“Thinking outside the box” has become such a constant mantra that the phrase itself has worn out. So we did it differently: we focused on the box — an entire block — and brought in new elements to mix them in a pioneering way. dBlock is a step forward for music festivals in Brazil. Instead of tents and mud, we make the most of the city's heritage and infrastructure. Instead of sending it off to a farm, we brought it to the heart of the country's largest city, right at one of its main transport hubs. That is truly green, pragmatic and sustainable. Much more than an event in Latin America's cultural capital, dBlock is an art and culture district surrounded by arenas and music clubs, with a strong avant-garde streak. We offer the universal language of good music to different audiences. Artists come together, styles merge. Diversity is the concept, and the city is the home. Street artists meet the mainstream; rock and jazz talk to MPB and electronic music. Thinking outside the box today may mean looking inside it • GEO", "st": ""}]}, {"k": "cap", "t": "A new concept built on 3 pillars"}]}, {"t": "Territorial Occupation • Musical Fusion • Musical Diversity", "items": [{"k": "imgs", "l": [{"id": "18ba48a4c8ecc19530e57ddd37797b75", "w": 800, "h": 800}, {"id": "4fdb5a45a10701600e056ccdc50263c4", "w": 800, "h": 800}, {"id": "9a5cf62b50fc73282fb1c20848e6a282", "w": 463, "h": 449}, {"id": "404b06bb5d826a16ffa5bdcdca36ba4e", "w": 800, "h": 800}, {"id": "13c33578c26ffacbb16904cb411344ba", "w": 800, "h": 800}, {"id": "b481a995960202adea54d62444b5bdbe", "w": 800, "h": 800}, {"id": "7941d8c4f3ebab38e94af277d4aa2eb6", "w": 800, "h": 800}, {"id": "667b864ff7727520b7411ac9b8776591", "w": 800, "h": 800}, {"id": "329e4473871d6c8a155fcf4a9a32e317", "w": 800, "h": 800}, {"id": "6d494dcaa4104de901315fe9904a66c4", "w": 800, "h": 800}, {"id": "86e5678541c6899 a has been around for more than 20 years. In its second Brazilian edition, the festival brought a current line-up of major international names. Held at São Paulo's Jockey Club over the Easter holiday, Lollapalooza Brasil had five stages and over seventy acts. That year Lolla gained a third day, reinforcing the “Occupy SP with music” concept.", "st": ""}]}]}, {"t": "2012 — Everywhere", "items": [{"k": "p", "s": [{"t": "A young festival for young people. Where do you find an audience that is everywhere? By going everywhere: cinema, social media, magazines, airports, the metro, radio, bars and even iTunes. With R$ 10.2 million in media, an integrated plan that not only promoted the festival but told the story of its 20 years.", "st": ""}]}]}, {"t": "2012 — Our spokesman: Dave Grohl", "items": [{"k": "p", "s": [{"t": "Over 1 million views of the interview in which Dave Grohl announces he's coming and presents the festival line-up.", "st": ""}]}, {"k": "vids", "l": [{"y": "XeMLJpoLBgQ", "th": "be48e44ae647f35191a3281cf70fe8cb"}]}]}, {"t": "2012 — Lolla Brasil at the cinema", "items": [{"k": "p", "s": [{"t": "Nothing better than the cinema screen to tell the story of Lollapalooza's 20 years, its concept and its arrival in Brazil. A partnership with Cinemark brought a mini-doc to its digital screens.", "st": ""}]}, {"k": "vids", "l": [{"y": "8zZbTQC1YzM", "th": "f6f544229e4dfea0cf91e98ac2583929"}]}]}, {"t": "2012 — As interactive as an app", "items": [{"k": "p", "s": [{"t": "To promote the festival and the official app, an interactive ad in Rolling Stone, with over 50,000 interactions. And on the yellow metro line, 600 metres from the Jockey Club, a QR code to build and share the line-up.", "st": ""}]}, {"k": "imgs", "l": [{"id": "85afdda6a1bdde15e7770ce5b38c9646", "w": 1000, "h": 707}, {"id": "6e4ccc643351729c68227058bafec59d", "w": 670, "h": 503}, {"id": "b1ae502249d9855f2526bf056c50974e", "w": 1000, "h": 664}]}, {"k": "imgs", "l": [{"id": "86b607021271c7f305d569c3b83f20de", "w": 670, "h": 505}, {"id": "a60f3aa4736d0a3cffd50f5e66765f52", "w": 546, "h": 662}]}]}, {"t": "2012 — Social media and digital", "items": [{"k": "p", "s": [{"t": "Social media was the campaign's main focus: from 0 to 600,000 followers in two years, over 80,000 sign-ups and an audience that not only consumes content but creates its own. 150,000 Facebook likes in the first month, 1 million site visits, 3,000 app downloads and 12 times in trending topics.", "st": ""}]}, {"k": "vids", "l": [{"y": "6eoTXGcXBv4", "th": "ce06888dd47a5d8aa79e425b4fa47c67"}]}]}, {"t": "2012 — Live, wherever you are", "items": [{"k": "p", "s": [{"t": "Multishow broadcast the main stages live, while the Perry and Alternative stages streamed online. Over 43 million people tuned into Multishow during 20 hours of coverage, with 1.2 million page views on the channel's site and nearly 260,000 live views.", "st": ""}]}]}, {"t": "2013 — Challenge", "items": [{"k": "p", "s": [{"t": "Research with Limo Inc at Lolla 2012 showed over 70% of the audience bought tickets for the headliners, 20% for an international festival experience and nearly 10% to join friends. The challenge was to grow the desire for the festival experience and rely less on big bands: build a strong brand tied to discovering new sounds. Another insight: 70% of the audience came from outside São Paulo over the Easter holiday.", "st": ""}]}]}, {"t": "2013 — Occupy São Paulo with music", "items": [{"k": "p", "s": [{"t": "With R$ 24 million in media, Lolla 2013 wanted more than to reveal the line-up and sell tickets: it wanted to position the festival nationwide. The concept invited fans to live the music not only for 3 days at the Jockey Club but all Easter week across the city: free shows at Galeria do Rock and in the outskirts, side shows, an official poster contest with Urban Arts and exclusive content in the two months before the festival.", "st": ""}]}, {"k": "imgs", "l": [{"id": "e875d0602dcc842d1e4ad275aec9ddb7", "w": 670, "h": 1173}]}]}, {"t": "2013 — Line-up launch film", "items": [{"k": "imgs", "l": [{"id": "84f72638dcee4f6ea466fbf275337dda", "w": 670, "h": 450}, {"id": "6c858a8a64e101628009771cbf80d573", "w": 670, "h": 350}, {"id": "93b50c0a33174e6bef6ba013a402a69e", "w": 670, "h": 350}, {"id": "d719213363935efc2f9e1d4cfb257566", "w": 670, "h": 350}, {"id": "b45b95320d2b7cbc514fdf03e19e1b66", "w": 670, "h": 350}, {"id": "79581007f92b1d43d090841aa0b5fcb5", "w": 670, "h": 350}, {"id": "64c3c39e6b4dc814894e5d49b5c59b23", "w": 670, "h": 350}, {"id": "1e131612f13961e223c0c9e2e11f3c99", "w": 670, "h": 350}, {"id": "dc44e1a9c067dd038dd7d3409d1ef185", "w": 670, "h": 350}, {"id": "c9dad0e93d85c65bf2e4bef156e7b3f3", "w": 670, "h": 350}, {"id": "37a9edfccdffa255a57f9df2e7708c00", "w": 670, "h": 350}, {"id": "8b2da987b3f8c420137c9d6591f45c5a", "w": 670, "h": 446}]}]}, {"t": "2013 — Schedule reveal", "items": [{"k": "p", "s": [{"t": "Every like on the campaign's Facebook post raised the curtain hiding the band names a little. With enough likes, fans saw each day's full line-up.", "st": ""}]}, {"k": "imgs", "l": [{"id": "1b22f5eb34d33cd31999e3f506f482f6", "w": 1103, "h": 596}, {"id": "ffde43610f21435751bdd7f1089a3103", "w": 1121, "h": 728}]}, {"k": "imgs", "l": [{"id": "8c5707ab25d64d8540d8f95f1e4c7e30", "w": 1024, "h": 900}, {"id": "1e9eca197b5ea5baa2cb508df6779896", "w": 1116, "h": 771}, {"id": "e15b0e8d9e2c6a8108ef09204bf6cbf0", "w": 1124, "h": 788}]}]}, {"t": "2013 — Official poster contest", "items": [{"k": "p", "s": [{"t": "The public was invited to create the festival's official poster in a contest with Urban Arts. Over 600 posters were entered, generating over R$ 10 million in earned media.", "st": ""}]}, {"k": "imgs", "l": [{"id": "dd46b26a23f45336a0c993a6123b521b", "w": 557, "h": 733}, {"id": "1831872f8bad6a385b3fe8a148989704", "w": 557, "h": 733}, {"id": "c0f4a57af75c23d51cf01458938df7ab", "w": 557, "h": 733}, {"id": "74cfff41ff277716621189a3577c1fd3", "w": 1250, "h": 1367}]}]}, {"t": nd 4,000 conversations", "st": ""}]}]}, {"t": "Broadcast", "items": [{"k": "p", "s": [{"t": "An event designed to be broadcast across Brazil on Multishow, with programmes distributed to 170 stations worldwide and an audience above 26 million viewers, valued at over US$ 47 million.", "st": ""}]}]}]}, {"id": "heineken-lolla-2012", "title": "Heineken — Lollapalooza Brasil 2012", "cat": "Events", "client": "Heineken", "year": "2012", "desc": "Activations for the official beer at the first Lollapalooza Brasil.", "thumb": "2431a7b9afb8fe811365b8156c83895d", "secs": [{"t": "Green light for music", "items": [{"k": "p", "s": [{"t": "Besides never leaving the crowd's hands, the official beer of Lollapalooza Brasil never left their minds. The brand delivered memorable activations across the Jockey Club, with experiences off stage too: Beer Station, Backpackers, Heineken in the Sky, Heineken Moments, neon sticks, draft stations, arena visibility and social responsibility.", "st": ""}]}, {"k": "imgs", "l": [{"id": "2431a7b9afb8fe811365b8156c83895d", "w": 1000, "h": 598}, {"id": "47e4ddd5f4ae69556cb6946448a0761e", "w": 1000, "h": 598}, {"id": "0a9f4e560101ca62aef2ba0487d2deb3", "w": 1000, "h": 598}]}]}, {"t": "Results", "items": [{"k": "p", "s": [{"t": "For 60% of attendees who also went to Rock in Rio or SWU, Heineken had more and better activities at Lollapalooza. 65% linked the brand to responsible drinking and 31% to sustainability. Heineken was the festival's leading brand, with the highest recall.", "st": ""}]}]}]}, {"id": "cocazero-lolla", "title": "Coca-Cola Zero — Lollapalooza Brasil", "cat": "Events", "client": "Coca-Cola", "year": "2012", "desc": "The Mosh Simulator: a photo of you crowd-surfing at Lolla, ready to share.", "thumb": "c43853bac3d84156a8c4bf5e67eaeda6", "secs": [{"t": "Mosh Simulator", "items": [{"k": "vids", "l": [{"y": "g0GC5T98tnE", "th": "c38db37d1f8e2602636254b8234f592c"}]}, {"k": "imgs", "l": [{"id": "c43853bac3d84156a8c4bf5e67eaeda6", "w": 1000, "h": 599}, {"id": "4c9199a33dfdbc9b9ec6bc33d385413f", "w": 1000, "h": 598}, {"id": "539ee95cff6d0db894b450adf9bb585a", "w": 1000, "h": 599}]}]}]}, {"id": "yahoo-bic", "title": "Yahoo! Big Idea Chair", "cat": "Events", "client": "Yahoo! Brasil", "year": "2007", "desc": "Yahoo!'s global award adapted to the Brazilian market, with a single category: the big idea.", "thumb": "1419b2cc2695159ac0e1783bac8ab65f", "secs": [{"t": "Challenge", "items": [{"k": "p", "s": [{"t": "Adapt the award to the Brazilian market and raise Yahoo!'s relevance locally. In other countries the award piggybacked on other major awards, recognising work that used the Y! platform.", "st": ""}]}, {"k": "imgs", "l": [{"id": "1419b2cc2695159ac0e1783bac8ab65f", "w": 877, "h": 522}, {"id": "fa248e0b4ce17bb7cb326c39d78d17f0", "w": 877, "h": 522}]}]}, {"t": "Building the insight", "items": [{"k": "p", "s": [{"t": "Yahoo! faced a big barrier in Brazil: few events specific to the category, or owned by competitors. Barrier to entry vs. an opportunity to stand out: we turned the problem into the solution.", "st": ""}]}]}, {"t": "Our proposal", "items": [{"k": "p", "s": [{"t": "Break away from conventional formats and celebrate not the little good ideas but THE BIG IDEA: an award with one single category, recognising the whole chain behind a big idea.", "st": ""}]}, {"k": "imgs", "l": [{"id": "fccc5f0ec0091b103ac6f6ee479c805c", "w": 1000, "h": 605}, {"id": "7790615dd2dedd5f8086721bb4f12096", "w": 1000, "h": 612}, {"id": "d453f980863c44d319169b5dfa5c80f4", "w": 1186, "h": 596}, {"id": "3e6eb99fab3bb306c22d0dfeb301789a", "w": 1187, "h": 535}, {"id": "5fc054b4484366a4705c6232f2f42353", "w": 1178, "h": 420}]}]}, {"t": "Print", "items": [{"k": "imgs", "l": [{"id": "092dac25deae3f8766d84ee71c6e677b", "w": 933, "h": 494}, {"id": "134ef7fa758d1ab9a8cf2ce0392ae71a", "w": 938, "h": 566}, {"id": "f7ebe42e08172ddfc03b3f6ab359f506", "w": 924, "h": 588}, {"id": "d8856042912f626cde60e43e6b2fbcc0", "w": 932, "h": 600}]}]}]}, {"id": "heineken-lolla-2013", "title": "Heineken — Lollapalooza Brasil 2013", "cat": "Events", "client": "Heineken", "year": "2013", "desc": "LED wristbands, a Ferris wheel and the Jockey Club lit green across the three festival days.", "thumb": "42ab4e3e66af1775df309b14836d32b3", "secs": [{"t": "Green across the festival", "items": [{"k": "p", "s": [{"t": "Combining the best of the Lollapalooza experience with the pleasure of a Heineken, the official beer's activations were even more memorable. Present throughout the festival, green brought freshness by day and energy by night, lighting up the Jockey Club.", "st": ""}]}, {"k": "vids", "l": [{"y": "b8uuWsYiN8I", "th": "e5ad0aa84499b2da36f882c797728c4a"}]}]}, {"t": "Heineken Moment", "items": [{"k": "p", "s": [{"t": "Together with PixMob, we brought radio-controlled LED wristbands to Brazil, lighting up to the Heineken soundtrack during a video and thrilling the crowd with a light show.", "st": ""}]}, {"k": "imgs", "l": [{"id": "6429054a607a0cc964c8f11b871a8f13", "w": 1130, "h": 430}]}, {"k": "vids", "l": [{"y": "dR-rlh3hFxY", "th": "f8f2b253fe0a482cff6e79b6bab35947"}, {"y": "Uc8Vp0QNmOQ", "th": "4cb4e8f33eaca7de6af2452ae28ff843"}]}]}, {"t": "Ferris wheel", "items": [{"k": "p", "s": [{"t": "A classic at the world's biggest festivals, the Heineken Ferris wheel had a lounge serving the Perfect Draught, a photo booth and free wi-fi.", "st": ""}]}, {"k": "imgs", "l": [{"id": "42ab4e3e66af1775df309b14836d32b3", "w": 1600, "h": 900}, {"id": "d602cbff5cecaf943a34f9e052f53fd9", "w": 1600, "h": 900}, {"id": "d91279380a497df2661d0f24876876f8", "w": 1600, "h": 900}, {"id": "7471adf9b26dad72098565ae108e2023", "w": 1600, "h": 900}, {"id": "812f14bf2f558378b87b6edaf6dfb99d", "w": 1600, "h": 900}]}]}, {"t": "Shade lounge", "items": [{"k": "p", "s": [{"t": "60 Heineken-branded poufs.", "st": ""}]}, {"k": "imgs", "l": [{"id": "d73844e2f262b8c794d921423beb1f24", "w": 1600, "h": 900}, {"id": "7a132bac03ff554627b3f48ac86de4ed", "w": 1600, "h": 900}]}]}, {"t": "Rock and Recycle", "items": [{"k": "p", "s": [{"t": "Disposable cups collected by the audience were swapped for giveaways.", "st": ""}]}, {"k": "imgs", "l": [{"id": "18f9fe50051049659c4cbf1dcd03d892", "w": 1600, "h": 900}, {"id": "a25bc73e4df4728b9e95b6f575660275", "w": 1600, "h": 900}, {"id": "2e0f7e0965a5b35134178340cc6c2b09", "w": 1600, "h": 900}]}]}, {"t": "Giveaways", "items": [{"k": "imgs", "l": [{"id": "df33790c2e38d03db095d876c7d14fc4", "w": 1600, "h": 900}]}]}]}, {"id": "corrida-cartoon", "title": "Cartoon Network Run", "cat": "Events", "client": "Cartoon Network", "year": "2015", "desc": "A family run where kids race in teams with an adult, taken to Rio de Janeiro for the first time.", "thumb": "44c2b85dd073b5dd9ae94f6b789bc919", "secs": [{"t": "Challenge", "items": [{"k": "p", "s": [{"t": "Evolve a project that was already a hit with audiences and sponsors, with 20% more attendance than in 2014 in São Paulo, and take the event concept to Rio de Janeiro for the first time.", "st": ""}]}]}, {"t": "Solution", "items": [{"k": "p", "s": [{"t": "We studied the motivations and interests of the 4-to-14 audience to understand who these young fans of the channel are, reaching parents indirectly.", "st": ""}]}]}, {"t": "Generation Z", "items": [{"k": "p", "s": [{"t": "Children and pre-teens born into the world of the internet, countless TV channels, smartphones, tablets and above all video games, today the world's biggest entertainment industry. With this generation in mind we arrived at gamification: interaction strategies with incentives that drive engagement through play.", "st": ""}]}, {"k": "imgs", "l": [{"id": "44c2b85dd073b5dd9ae94f6b789bc919", "w": 992, "h": 557}, {"id": "914846b811cd45016d9aeea59596e972", "w": 947, "h": 532}, {"id": "fce6b825bfacd524b1c01c1ea39e2edf", "w": 948, "h": 534}, {"id": "058b2f8184c2c2d764271ab4a938cef5", "w": 948, "h": 532}, {"id": "12d1d2d35570ad7e20eaba923a2f6860", "w": 949, "h": 560}, {"id": "35e5c67ac94d709088b392fc5984249b", "w": 948, "h": 532}, {"id": "2bc32529755254efe5bd73fda124bb62", "w": 948, "h": 531}, {"id": "2cfb5d07d3d3c744489b917ea581d4eb", "w": 946, "h": 531}]}]}, {"t": "Run your way", "items": [{"k": "p", "s": [{"t": "In 2015 the Cartoon Run became much more fun and irreverent, the way kids like it: an interactive, challenging run where whoever has the most fun wins.", "st": ""}]}, {"k": "vids", "l": [{"y": "VsCFZM3oeEA", "th": "bf93e1310272f1650d871ca75bce94b1"}]}]}]}];

0238d3e0e3a868", "w": 1400, "h": 647}, {"id": "72a8436a50e8713586c029fa52e65d98", "w": 1024, "h": 768}, {"id": "5f333a73e2916edda651310697692b58", "w": 768, "h": 1024}, {"id": "a10c0dbf59f92ff52203eca924ea18e8", "w": 1115, "h": 1400}]}]}]}];
const caseStory = {"nba-deck": {"st": "A deck to sell the NBA in Brazil: data, fans and properties told like a big game.", "rows": [{"k": "The project", "v": "NBA Brasil needed a sales presentation for the 2021/22 season, the league's 75th, showing brands and sponsors the size of its fan base in Brazil and everything the league offers here."}, {"k": "What I did", "v": "Art direction for the whole deck: visual narrative, layout of audience data and a distinct language for each platform — Events, NBA House, Jr. NBA, Her Time to Play, NBA Basketball School and Media."}, {"k": "Deliverables", "v": "Sales deck · Infographics · Chapter openers · Image treatment"}]}, "stap-syngenta": {"st": "Syngenta held its 2025 Technical Councils Meeting, bringing together the partners of its three councils — Consherb, Consent and Consfit — at the Royal Palm Plaza in Campinas.", "rows": [{"k": "The challenge", "v": "The meeting also celebrated the councils' 25th anniversary, bringing them together in a single event for the first time. For Stap Feelings, Syngenta's live marketing partner, it was a chance to show our work, from design and creation to operation, built day by day, minute by minute, making every step an important part of an incomparable event."}, {"k": "The solution", "v": "Seizing a unique opportunity to bring the councils together, we created an event focused on relationships and on sharing knowledge and results. The highlight, at the opening plenary, was the connection of the three councils in an innovative representation that brought concept and design together. In a show of technique and visual and sound effects, three giant LED panels — one per council — joined to form a single one, expressing a shared vision aligned with the future of agribusiness."}, {"k": "Experiences", "v": "The experiential mood, present from the opening, continued with several activations and surprises throughout the event. Notably, participants received an integration passport encouraging interaction and exchange between the councils. A special experience was saved for the last day: a visit to the Innvernia winery in Espírito Santo do Pinhal, with a wine tasting, a paired lunch with live music and a visit to the vineyard, where participants learned about its vine adoption program."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-vwfest": {"st": "The event had to be a moment of pure connection.", "rows": [{"k": "The challenge", "v": "Held at the Lar Center complex in São Paulo on June 28 and 29, it set out to promote Brazil's biggest sales festival while offering a family day full of unforgettable experiences and relationships. The São Paulo Volks Festival set the standard for the 2025 season. From August to December, the event toured 5 more state capitals: Salvador, Brasília, Goiânia, Porto Alegre and Curitiba."}, {"k": "The solution", "v": "Stap led creation and production, delivering a modern, functional design with creative, high-impact communication. The event included the Best Drive activation, Volkswagen's flagship test drive. The full operation, also run by Stap, covered logistics, build, supplier and partner management, reception and registration, experiences and support for participating dealers."}, {"k": "Curitiba — closing in style", "v": "The Volks Festival closed the 2025 season in Curitiba, at the Pedreira Paulo Leminski, a traditional venue for major events in the city. The original design was adapted to make use of the local structure, proving its modularity and adaptability without losing functionality or visual identity."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-seara-diac": {"st": "Seara brought together supermarket chain owners at Espaço L’Atelier, São Paulo, in July 2025.", "rows": [{"k": "The challenge", "v": "The focus was to present a new company strategy to revolutionize the point of sale, by understanding shopper behavior and new opportunities to grow the business. Starting a new live marketing partnership, Stap delivered excellence in creation, design, production and event management, creating the right environments for each moment and connecting relationships, information, innovation and experiences."}, {"k": "The solution", "v": "A content-rich plenary brought guests together in a comfortable, welcoming auditorium. A giant LED screen supported speakers from Seara's marketing and sales teams, presenting market figures, changes in consumer behavior, openings for innovation and the opportunities of growing demand. To round it off, a panel of experts debated the point of sale, building a relevant picture for the audience and the goals of the meeting."}, {"k": "Experiences", "v": "Participants enjoyed true taste experiences with a big tasting that proved the quality of Seara products in practice. There were two moments: the first on arrival, with a welcome coffee in a point-of-sale setting designed by the agency; the second at the end, with a pleasant happy hour to the great jazz of Amber Banda. In every detail, an unforgettable event with the Stap signature, connecting brand, market and retail channels, with a lasting impression for Seara and its guests."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-loyant": {"st": "Launching a herbicide the way you launch a brand.", "rows": [{"k": "The challenge", "v": "For Corteva, launching a new herbicide for rice crops called for more than an event: it had to highlight the company's commitment to innovation and surprise a technical audience with a memorable experience."}, {"k": "The solution", "v": "At Casa NTX in Porto Alegre, we built a stage with an immersive screen that drew the audience into the content, connecting innovation and technology. The space was planned to be comfortable and integrated. To ensure quality and flow, the build was closely followed at every stage."}, {"k": "Experiences", "v": "From the pre-event, with strategic digital communication, to the closing show by Fernando & Sorocaba, everything was designed to make an impact and reinforce the brand's positioning. The set design, content and innovative audience layout reinforced the sense of modernity and innovation."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-prospera": {"st": "A set that gives agribusiness content the look of a real show.", "rows": [{"k": "The challenge", "v": "Focused on Corteva's Prospera program, a special TV production set out to record results in rural communities in the state of Pernambuco."}, {"k": "The solution", "v": "Stap was responsible for producing the TV special, including field shoots and interviews with beneficiaries and leaders, as well as the script, direction, logistics and the project's visual identity."}, {"k": "Experiences", "v": "With appearances by the Minister of Agriculture, the Secretary of Family Farming and executives from Corteva, Yara and AGCO, the content reinforced the program's impact and Corteva's position as a partner in rural development."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-petronas": {"st": "Three moments of the F1 Grand Prix in São Paulo, worthy of Petronas.", "rows": [{"k": "The challenge", "v": "During the F1 Grand Prix in São Paulo, Petronas needed to highlight three key moments: a sales convention, a press conference and a stakeholder dinner."}, {"k": "The solution", "v": "We met the challenge by creating experiences with innovation, belonging and visibility worthy of the brand. In every detail, the agency's work was designed for impact and flow: a convention with set design center stage, a press conference with precise logistics and a dinner with a warm atmosphere."}, {"k": "Experiences", "v": "The press conference brought together Petronas team drivers Lewis Hamilton and George Russell and generated major press exposure. The dinner focused on relationships, comfort and excellent service. Team building, gifts and attendance at practice and the GP marked the convention. At the press conference and dinner, interaction with personalities and one-to-one actions strengthened the bond with the brand."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-gazoo": {"st": "Gazoo Racing Day is Toyota's main global platform for connecting motorsport, innovation and people development.", "rows": [{"k": "The challenge", "v": "The challenge was to turn that idea into a brand experience that generated relationships, visibility and relevant content."}, {"k": "The solution", "v": "Stap planned and produced the entire event structure at the racetracks, handling vehicle logistics, space builds, flow planning, supplier management and technical operation, ensuring comfort, safety and alignment with the brand's goals."}, {"k": "Experiences", "v": "The event featured test drives, technical demonstrations, interaction with drivers and exclusive activations for different audiences. Over two days it welcomed specialist press, customers, partners and guests, including the GR Day Woman edition, dedicated to driving experiences centered on women."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-hilux": {"st": "Toughness isn't explained. It's lived.", "rows": [{"k": "The challenge", "v": "Toyota wanted to reinforce the Hilux's position as a rugged, reliable vehicle by creating Hilux Expedition, a regularity rally that became an engaging experience with strong brand presence in key markets."}, {"k": "The solution", "v": "The agency managed the entire Hilux Expedition operation, including calendars, routes, regulations, registrations, permits, dealer participation, full logistics and supplier hiring, always aligned with the client's goals and focused on safety and efficiency."}, {"k": "Experiences", "v": "Participating owners tested their vehicles on different terrains, with technical support and activations highlighting the Hilux's strengths. The action drove engagement, environmental responsibility — tree planting — and brand reinforcement along the route."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-ox": {"st": "The OX Cosméticos booth was one of the highlights of Beauty Fair 2025.", "rows": [{"k": "The challenge", "v": "The strategy was to reinforce the partnership with the Mari Maria brand and highlight the launches co-created with OX: the OX Science line, the cocoa-based Wonka line and OX's innovative actives. With so many stars on stage, live marketing became even more important. With our expertise, we delivered the best in design, creation, production and operation."}, {"k": "The solution", "v": "Starting with the booth, we created a design as innovative and bold as the OX brand, with attractive, elegant lines in harmony with the featured launches. The project included high-impact visual communication featuring the entire OX Haircare portfolio and a structure for relationships and business. To finish, an exquisite, safe build of impeccable quality. In operation, we were present in every space and moment, ensuring flow, hospitality and visitor and guest retention."}, {"k": "Experiences", "v": "Visitors to Beauty Fair enjoyed fully connected experiences. In the OX Science area, scanner technology read and diagnosed hair treatment needs, delivered to each participant via QR code. In the Wonka area, the experiences focused on the launches. For Stap Feelings, the event was a chance to show our work in every space and moment, optimizing results and strengthening the partnership with the client."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-seara-bahia": {"st": "With a standout presence at SuperBahia 2025, Seara completed an important step in its strategy of brand building and market expansion, this time focused on supermarket entrepreneurs in Brazil's Northeast.", "rows": [{"k": "The challenge", "v": "As its new live marketing partner, Stap also landed in Salvador committed to another quality delivery, handling design, production and operation."}, {"k": "The solution", "v": "The agency created a modern, open and inviting booth with a strong style and personality and integrated solutions for relationships and business, connecting functionality — a welcoming lounge and several meeting rooms for simultaneous meetings —, brand exposure and high-impact visual communication with plenty of content covering Seara's product lines and many launches."}, {"k": "Experiences", "v": "With its integrated management expertise, the agency took on reception and hospitality to make every visit a rewarding, enriching experience. In a journey of sensations, the connection with the products, sparked by eye-catching visual communication, was completed by a high-end tasting of Seara's product lines."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-grunner": {"st": "For Grunner, visitors to its Agrishow booth had to feel at home.", "rows": [{"k": "The challenge", "v": "The booth also had to reflect pioneering quality and technology which, along with ruggedness and durability, set its products for the field apart."}, {"k": "The solution", "v": "The booth — modern and bold, like the brand — came from a design tailored to Grunner: accessible and functional for relationships and business. High-impact visual communication and the Grunner boutique were key to reinforcing brand presence and experience."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-fmc": {"st": "A partnership that keeps on rolling across the Circuito Agro.", "rows": [{"k": "The challenge", "v": "Stap continues as FMC's partner on the 2026 Circuito Agro, bringing its expertise in design, build and operation to optimize the company's presence, reinforce its position as a benchmark in agricultural technology and strengthen its partnership with growers."}, {"k": "The solution", "v": "Since 2025 the agency has delivered a new modular booth with a strong personality. It combines a down-to-earth style with strong brand presence and details that connect design, materials and finishes. High-exposure visual communication and content, accessibility and transparency create an inviting space where visitors find welcoming, comfortable areas and themed settings with references to the countryside."}, {"k": "Operation", "v": "Stap manages the operation end to end, supporting relationship and business activities that include specialized service, talks and visits to the applied-technology plots, with all the safety and comfort of a functional structure."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-vwagro": {"st": "To strengthen the brand's presence in agribusiness, Volkswagen needed a booth that mirrored its identity and created a direct connection with the public.", "rows": [{"k": "The challenge", "v": "The challenge was to translate the brand's attributes into an experience that brought together form, function and relationships."}, {"k": "The solution", "v": "Stap developed a modular structure adaptable to the different formats of the Circuito Agro, with timber set design, landscaping and exhibition areas that showcased the vehicles. The operation was designed for efficiency, accessibility and seamless flow between spaces."}, {"k": "Experiences", "v": "The relaxed, upbeat atmosphere — with Volkswagen-standard hospitality — won visitors over, creating a strong connection with the brand and its products."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-ford": {"st": "In the 2026 season, Ford keeps its focus on the agribusiness circuit events, which deliver the company's best ROI.", "rows": [{"k": "The challenge", "v": "Stap continues as its live marketing partner, standing alongside Ford to optimize a winning project inspired by the Built Ford Tough concept, which adds quality, durability and strength to the brand's image in Brazilian agribusiness."}, {"k": "The solution", "v": "Continuing the strategy of building the brand image through a rugged, high-quality, safe booth, the agency reinterpreted the 2025 design, keeping the corten steel façade, whose modern-rustic look is fully integrated with the Raça Forte line-up key visual. The work included layout and functionality improvements, stronger brand presence and high-exposure visual communication aligned with the Ready Set Ford campaign."}, {"k": "Operation", "v": "Through integrated management, the agency handles suppliers and partners, runs the operation and supports the Test Drive build and operation. To stay consistent with previous seasons, qualify as many customers as possible and increase retention, KPIs such as sales, ROI, test drives, attendance and relationship and business meetings are tracked. A 12-event season includes 4 regional events, with a pocket version of the project and strong participation from local dealers."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-gafff": {"st": "GAFFFF – Global Agribusiness Festival brings together the world's largest agribusiness forum, an agricultural fair and an entertainment and food event.", "rows": [{"k": "The challenge", "v": "Corteva was the lead sponsor of the 2025 edition at Allianz Parque, São Paulo. Stap, its live marketing partner, was tasked with turning Corteva's presence into a unique experience, connecting design, production and operation into a complete solution for the client."}, {"k": "The solution", "v": "With a design built for the arena setting and the scale of GAFFFF, Stap delivered a themed booth matched to the event and its audience, prioritizing spaces for relationships and business, and visual communication highlighting the brand and Corteva's solutions for growers."}, {"k": "Experiences", "v": "Visitors found a booth with a relaxed, friends-get-together feel, set against the buzz and attractions of the event. On the mezzanine, Corteva hosted guests to enjoy every moment of GAFFFF 2025 exclusively — a privileged spot with security, comfort and VIP service."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-lorenzetti": {"st": "At one of the largest construction, architecture and interior design shows, Lorenzetti wanted more than a booth.", "rows": [{"k": "The challenge", "v": "The challenge was to create a space that embodied the idea of home and connected with the public through real experiences with its products."}, {"k": "The solution", "v": "The agency developed a booth set up as a model home, with generous spaces, designed lighting and displays showing the products in use. The set design used visual elements associated with water, which is central to the Lorenzetti brand."}, {"k": "Experiences", "v": "The tour of the house was designed as a customer journey, combining function and concept. The space included lounge areas with bleachers fitted with tables and power points, which became a meeting point and a highlight of the fair."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-japao": {"st": "Toyota celebrating its roots at the Japan Festival.", "rows": [{"k": "The challenge", "v": "Toyota's goal was to reinforce its ties to Japanese culture, paying tribute to 110 years of Japanese immigration to Brazil, while showcasing its launches at an event able to connect tradition and innovation."}, {"k": "The solution", "v": "The agency created a booth based on early 20th-century Japanese architecture, blending modern and traditional elements. It reinterpreted the floating lanterns of the Obon festival as paper boats carried along an imaginary stream across the booth's ceiling, a nod to the first Japanese immigrants who landed in Santos in 1912."}, {"k": "Experiences", "v": "The booth featured cultural performances, origami workshops and other activations integrated with the Toyota vehicle showroom, engaging the public and connecting tradition, innovation and technology."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "stap-nupay": {"st": "NuPay at Latin America's largest digital commerce event.", "rows": [{"k": "The challenge", "v": "Nubank needed a booth to build brand awareness, highlight its connection with technology and innovation, and offer a hands-on experience of the new NuPay product to different audiences."}, {"k": "The solution", "v": "The agency developed a set design with multiple touchpoints, reinforcing the brand's technology positioning and creating an interaction circuit to encourage participation and make the new NuPay product easy to understand."}, {"k": "Experiences", "v": "The booth had an activation area at the entrance that made the sales approach easier. Inside, visitors had access to content, talks and demos that showed NuPay's advantages in practice."}, {"k": "Deliverables", "v": "Creation, design, production and operation"}]}, "cvnv": {"st": "A Broadway musical starring Gregorio Duvivier and Luiz Fernando Guimarães. From brand to playbill.", "rows": [{"k": "The project", "v": "A musical comedy by Charles Möeller & Cláudio Botelho, produced by GEO, running from March to June 2013 at Teatro Oi Casa Grande, Rio de Janeiro."}, {"k": "What I did", "v": "Built the brand and all of the show's communication, from photo retouching to the deluxe playbill."}, {"k": "Deliverables", "v": "Brand · Promotional materials · Opener and videos · Playbill · Website · Landing page · Digital · Sales deck"}]}, "billabong": {"st": "The Brazilian leg of the world's biggest surf championship.", "rows": [{"k": "The project", "v": "The third Billabong Rio Pro drew more than 100,000 people over eight days and generated over R$ 51 million in earned media."}, {"k": "What I did", "v": "Concept and key visual based on the official poster, communication plan and event set desig <dt style="flex: 0 0 180px; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 4px">{{t.k}}</dt>
<dd style="flex: 1 1 160px; margin: 0; color: #5C5A55">{{t.v}}</dd>
</div>
</sc-for>
</dl>
</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; margin-top: 80px; border-top: 1px solid #111111; padding-top: 16px">
<span style="max-width: 34em; color: #5C5A55">Valores de referência 2026. Cada proposta é fechada a partir do briefing.</span>
<button type="button" class="kco-btn" onClick="{{openContact}}" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: #111111; color: #FAFAFA; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Request a quote →</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== PAINEL: PROJETO ABERTO ===== -->
<sc-if value="{{hasOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="{{cur.title}}" style="position: fixed; inset: 0; z-index: 50; overflow-y: auto; overflow-x: hidden; background: #FAFAFA; color: #111111; font-family: 'KCO Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.55">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 5.5vw, 80px) 120px">
<div style="position: sticky; top: 0; z-index: 2; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 20px 0 16px; border-bottom: 1px solid #111111; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span>{{curSection}} / {{cur.title}}</span>
<button type="button" data-esc class="kco-btn" onClick="{{close}}" style="min-height: 44px; padding: 0 18px; border: 1px solid #111111; background: transparent; color: #111111; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer">Close ✕</button>
</div>
<header style="padding-top: clamp(48px, 7vw, 112px)">
<div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: clamp(16px, 2vw, 28px)">{{cur.catYear}}</div>
<h2 class="kco-case-brand" style="margin: 0; font-family: 'KCO Grotesk', sans-serif; font-weight: 600; font-size: clamp(52px, 9.5vw, 168px); line-height: 0.88; letter-spacing: -0.035em; text-transform: uppercase; overflow-wrap: anywhere">{{cur.brand}}</h2>
<p style="margin: clamp(16px, 2vw, 28px) 0 0; max-width: 40em; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; font-size: clamp(13px, 1.1vw, 16px); line-height: 1.45">{{cur.line}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 32px 24px; margin-top: clamp(40px, 5vw, 80px)">
<p class="kco-case-st" style="flex: 999 1 520px; margin: 0; max-width: 24em; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: clamp(22px, 2.5vw, 40px); line-height: 1.08; letter-spacing: -0.01em; text-transform: uppercase">{{cur.statement}}</p>
<div style="flex: 1 1 280px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-content: start">
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Client / agency</div>{{cur.client}}</div>
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Category</div>{{cur.cat}}</div>
<div style="border-top: 1px solid #111111; padding-top: 10px"><div style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55; margin-bottom: 4px">Year</div>{{cur.year}}</div>

</div>
</div>
<sc-if value="{{cur.hasStory}}" hint-placeholder-val="{{true}}">
<div class="kco-story" style="margin-top: clamp(48px, 6vw, 96px); border-bottom: 1px solid #111111">
<sc-for list="{{cur.storyRows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; padding: clamp(20px, 2.4vw, 32px) 0; border-top: 1px solid #111111">
<div style="flex: 0 0 calc(25% - 18px); min-width: 200px; display: flex; gap: 16px; align-items: baseline"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">{{r.n}}</span><span style="font-family: 'KCO Grotesk', sans-serif; font-weight: 600; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.1; text-transform: uppercase">{{r.k}}</span></div>
<p style="flex: 999 1 520px; margin: 0; max-width: 40em; font-size: clamp(17px, 1.3vw, 20px); line-height: 1.5">{{r.v}}</p>
</div>
</sc-for>
</div>
</sc-if>
</header>
<sc-if value="{{cur.hasBanner}}" hint-placeholder-val="{{true}}">
<figure style="width: 100vw; margin: clamp(48px, 6vw, 96px) 0 0 calc(50% - 50vw); height: clamp(320px, 62vh, 760px); overflow: hidden; background: #111111"><img src="{{cur.banner}}" alt="{{cur.title}}" style="display: block; width: 100%; height: 100%; object-fit: cover"></figure>
</sc-if>

<sc-for list="{{cur.secs}}" as="sec" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; gap: 16px 24px; margin-top: clamp(56px, 6vw, 88px); padding-top: 14px; border-top: {{sec.rule}}">
<div style="flex: 0 0 calc(25% - 18px); min-width: 200px">
<h3 style="position: sticky; top: 92px; margin: 0; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.5; letter-spacing: 0.06em; text-transform: uppercase">{{sec.t}}</h3>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="2">
<sc-if value="{{it.isP}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; max-width: 38em">{{it.text}}</p>
</sc-if>
<sc-if value="{{it.isCap}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">{{it.text}}</p>
</sc-if>
<sc-if value="{{it.isImgs}}" hint-placeholder-val="{{false}}">
<div style="{{it.gridStyle}}">
<sc-for list="{{it.imgs}}" as="im" hint-placeholder-count="3">
<img src="{{im.src}}" alt="{{im.alt}}" loading="lazy" width="{{im.w}}" height="{{im.h}}" style="{{im.style}}">
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isGal}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="{{it.galLabel}}" class="kco-gal" style="{{it.gridStyle}}">
<sc-for list="{{it.tiles}}" as="tl" hint-placeholder-count="6">
<button type="button" class="kco-gal-tile" onClick="{{tl.open}}" aria-label="{{tl.label}}" style="{{tl.style}}"><img src="{{tl.src}}" alt="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover"><sc-if value="{{tl.more}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(17,17,17,0.62); color: #FAFAFA; font-family: 'KCO Grotesk', sans-serif; font-weight: 300; font-size: clamp(28px, 3vw, 44px); letter-spacing: -0.02em">{{tl.moreLabel}}</span></sc-if></button>
</sc-for>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 16px; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55"><button type="button" class="kco-nav" onClick="{{it.openFirst}}" style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">View full screen ↗</button></div>
</sc-if>
<sc-if value="{{it.isVids}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 24px">
<sc-for list="{{it.vids}}" as="v" hint-placeholder-count="1">
<a class="kco-vid" href="{{v.href}}" target="_blank" rel="noopener" aria-label="Watch video on YouTube (opens in a new tab)" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111">
<span style="position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #111111">
<img src="{{v.thumb}}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span class="kco-play" aria-hidden="true" style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; background: #111111; border: 1px solid #FAFAFA; color: #FAFAFA; font-size: 16px; transition: background .2s ease">▶</span>
</span>
<span style="display: flex; justify-content: space-between; gap: 16px; padding-top: 8px; border-top: 1px solid #D3CFC6; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase"><span>Video</span><span style="color: #5C5A55">YouTube ↗</span></span>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isMp4}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 24px; align-items: start">
<sc-for list="{{it.mp4s}}" as="m" hint-placeholder-count="1">
<video src="{{m.src}}" poster="{{m.poster}}" controls playsinline muted loop preload="metadata" aria-label="{{m.label}}" style="display: block; width: 100%; height: auto; max-height: 82vh; background: #111111"></video>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isLinks}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #111111; max-width: 720px">
<sc-for list="{{it.links}}" as="lk" hint-placeholder-count="2">
<a href="{{lk.href}}" target="_blank" rel="noopener" style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #D3CFC6; text-decoration: none"><span>{{lk.label}}</span><span aria-hidden="true">↗</span></a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{it.isCr}}" hint-placeholder-val="{{false}}">
<dl style="margin: 0; border-top: 1px solid #111111; max-width: 720px">
<sc-for list="{{it.cr}}" as="c" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 12px 0; border-bottom: 1px solid #D3CFC6">
<dt style="flex: 0 0 220px; color: #5C5A55">{{c.r}}</dt>
<dd style="flex: 1 1 220px; margin: 0">{{c.n}}</dd>
</div>
</sc-for>
</dl>
</sc-if>
</sc-for>
</div>
</div>
</sc-for>

<div style="display: flex; justify-content: space-between; gap: 24px; margin-top: 96px; border-top: 1px solid #111111; padding-top: 16px">
<button type="button" class="kco-btn" onClick="{{prev}}" style="min-height: 44px; padding: 0; border: 0; background: none; color: #111111; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.015em; text-align: left; cursor: pointer">← {{prevTitle}}</button>
<button type="button" class="kco-btn" onClick="{{next}}" style="min-height: 44px; padding: 0; border: 0; background: none; color: #111111; font-family: 'KCO Grotesk', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.015em; text-align: right; cursor: pointer">{{nextTitle}} →</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== LIGHTBOX DA GALERIA ===== -->
<sc-if value="{{lbOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="{{lbLabel}}" class="kco-lb" style="position: fixed; inset: 0; z-index: 70; display: grid; grid-template-rows: auto 1fr auto; background: #111111; color: #FAFAFA">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px clamp(16px, 3vw, 32px); font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{lbLabel}}</span>
<span style="display: flex; align-items: center; gap: 20px"><span aria-live="polite" style="font-variant-numeric: tabular-nums; color: #A8A49B">{{lbCounter}}</span><button type="button" data-lb-close onClick="{{lbClose}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #FAFAFA; background: transparent; color: #FAFAFA; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer">Close ✕</button></span>
</div>
<div class="kco-lb-stage" style="position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 clamp(56px, 7vw, 96px)">
<img src="{{lbSrc}}" alt="{{lbAlt}}" style="display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain">
<button type="button" data-lb-prev onClick="{{lbPrev}}" aria-label="Previous image" style="position: absolute; left: clamp(8px, 1.5vw, 24px); top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 1px solid #FAFAFA; background: rgba(17,17,17,0.6); color: #FAFAFA; font-size: 20px; cursor: pointer">←</button>
<button type="button" data-lb-next onClick="{{lbNext}}" aria-label="Next image" style="position: absolute; right: clamp(8px, 1.5vw, 24px); top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 1px solid #FAFAFA; background: rgba(17,17,17,0.6); color: #FAFAFA; font-size: 20px; cursor: pointer">→</button>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px clamp(16px, 3vw, 32px) 16px; justify-content: safe center">
<sc-for list="{{lbThumbs}}" as="th" hint-placeholder-count="6">
<button type="button" onClick="{{th.pick}}" aria-label="{{th.label}}" aria-current="{{th.cur}}" style="{{th.style}}"><img src="{{th.src}}" alt="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
</sc-for>
</div>
</div>
</sc-if>

<!-- ===== POP-UP: CONTATO / ORÇAMENTO ===== -->
<sc-if value="{{contactOpen}}" hint-placeholder-val="{{false}}">
<div onClick="{{closeContact}}" style="position: fixed; inset: 0; z-index: 80; background: rgba(17,17,17,0.55)"></div>
<div role="dialog" aria-modal="true" aria-label="Talk about a project" style="position: fixed; z-index: 81; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: #FAFAFA; color: #111111; padding: clamp(24px, 4vw, 40px); font-family: 'KCO Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.55">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #111111; font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">
<span>Quote — 2026</span>
<button type="button" class="kco-btn" onClick="{{closeContact}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #111111; background: transparent; color: #111111; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer">Close ✕</button>
</div>
<sc-if value="{{contactSent}}" hint-placeholder-val="{{false}}">
<h2 style="margin: 40px 0 16px; font-family: 'KCO Grotesk', sans-serif; font-weight: 300; font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -0.035em">Thank you<span style="color: {{accent}}">.</span></h2>
<p style="margin: 0 0 32px; color: #5C5A55">Your message is ready in your e-mail or WhatsApp — just confirm sending it there. I reply within 1 business day.</p>
<button type="button" class="kco-btn" onClick="{{closeContact}}" style="min-height: 48px; padding: 0 22px; background: #111111; color: #FAFAFA; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Back to the site</button>
</sc-if>
<sc-if value="{{contactForm}}" hint-placeholder-val="{{true}}">
<h2 style="margin: 32px 0 8px; font-family: 'KCO Grotesk', sans-serif; font-weight: 300; font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -0.035em">Let's talk<span style="color: {{accent}}">.</span></h2>
<p style="margin: 0 0 28px; color: #5C5A55">Tell me a bit about the project. You stay exactly where you were on the page.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px 24px">
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Name</span><input id="kco-f-nome" class="kco-in" type="text" autocomplete="name"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">E-mail</span><input id="kco-f-email" class="kco-in" type="email" autocomplete="email"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Company / agency</span><input id="kco-f-empresa" class="kco-in" type="text" autocomplete="organization"></label>
<label style="display: block"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">Project type</span><select id="kco-f-tipo" class="kco-in"><option>Campaign / key visual</option><option>Branding and identity</option><option>Presentation / pitch</option><option>Event / experience</option><option>Digital / social media</option><option>Other</option></select></label>
<label style="display: block; grid-column: 1 / -1"><span style="font-family: 'KCO Label', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5A55">About the project</span><textarea id="kco-f-msg" class="kco-in" rows="4"></textarea></label>
</div>
<p role="alert" aria-live="assertive" style="margin: 16px 0 0; min-height: 24px; font-size: 14px; color: {{accent}}">{{contactError}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px">
<button type="button" class="kco-btn" onClick="{{sendContact}}" style="min-height: 48px; padding: 0 22px; background: #111111; color: #FAFAFA; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Send by e-mail →</button>
<button type="button" class="kco-btn" onClick="{{sendWhats}}" style="min-height: 48px; padding: 0 22px; background: transparent; color: #111111; border: 1px solid #111111; font-family: inherit; font-size: 15px; cursor: pointer">Send via WhatsApp</button>
</div>
</sc-if>
</div>
</sc-if>
</template>
<div id="app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Enable JavaScript to see Kco Oyakawa's portfolio.</p></noscript>
</body>
</html>
